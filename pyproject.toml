[project]
name = "colpali-vision-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "colpali-engine>=0.3.17,<0.4",
    "fastapi>=0.141.1",
    "google-genai>=2.14.0",
    "langgraph>=1.2.9",
    "numpy>=2.5.1",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.14.1,<6.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: costly tests that load the real ColQwen2 model or call the live Gemini API. Run explicitly with `pytest -m slow`.",
]
addopts = "-m 'not slow'"
